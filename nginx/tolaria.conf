# Tolaria reverse proxy (wird vom Setup mit __PORT__ / __SERVER_PORT__ ersetzt)
#
# Auth-Modell:
#   /            -> HTTP Basic Auth (UI, statische Assets)
#   /tolaria-config.js -> HTTP Basic Auth (enthält das echte Bearer-Token)
#   /v1/         -> KEIN Basic Auth; der Tolaria-Client sendet
#                   "Authorization: Bearer <token>" selbst. Basic Auth würde
#                   diesen Header ersetzen und WebSocket-Tickets blockieren.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen __PORT__;
    server_name _;

    root /opt/tolaria/src/apps/web/dist;
    index index.html;

    client_max_body_size 50m;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    # Echter Healthcheck: fragt den Tolaria-Server, nicht nur nginx selbst.
    location = /healthz {
        auth_basic off;
        access_log off;
        proxy_pass http://127.0.0.1:__SERVER_PORT__/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Vite-Assets sind mit Content-Hash benannt -> lange cachen.
    location /assets/ {
        auth_basic "Tolaria";
        auth_basic_user_file /etc/nginx/.htpasswd-tolaria;
        expires 7d;
        try_files $uri =404;
    }

    location = /tolaria-config.js {
        auth_basic "Tolaria";
        auth_basic_user_file /etc/nginx/.htpasswd-tolaria;
        alias /etc/tolaria/tolaria-config.js;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:__SERVER_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Authorization wird unverändert an den Tolaria-Server weitergegeben.
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        auth_basic "Tolaria";
        auth_basic_user_file /etc/nginx/.htpasswd-tolaria;
        try_files $uri $uri/ /index.html;
    }
}

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Statische Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: shellcheck installieren
        run: |
          sudo apt-get update -qq -o Acquire::Retries=5
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Tests
        run: bash tests/static-checks.sh
